services:
  - type: web
    name: parada-onibus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker: o estado fica na memória do processo
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/estado
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TOKEN
        generateValue: true  # senha aleatória; copie do painel do Render para usar no ponte.py
